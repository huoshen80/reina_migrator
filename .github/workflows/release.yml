name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  
permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc

    - name: Cache cargo dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Build release
      run: cargo build --release --target x86_64-pc-windows-msvc

    - name: Prepare artifact
      run: |
        mkdir release
        copy target\x86_64-pc-windows-msvc\release\reina_migrator.exe release\
        copy README.md release\

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: reina_migrator-x86_64-pc-windows-msvc
        path: release/

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        name: reina_migrator-x86_64-pc-windows-msvc
        path: ./artifacts
      
    - name: Create release archive
      run: |
        zip_name="reina_migrator-${{ github.ref_name }}.zip"
        cd artifacts && zip -r ../$zip_name . && cd ..

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: reina_migrator-${{ github.ref_name }}.zip
        body: |
          ## ReinaMigrator Release

          自动构建的 Reina Migrator，可将 Whitecloud 数据库或 Reina Exporter 生成的 Playnite JSON 迁移到 ReinaManager。
          
          ### 使用方法
          1. 从 Whitecloud 迁移时，将 `db.3.sqlite` 放在程序同一目录
          2. 从 Playnite 迁移时，先使用 Reina Exporter 导出 JSON
          3. 运行 `reina_migrator.exe`，选择迁移来源
          4. 选择 ReinaManager 安装版或便携版数据库
        draft: false
        prerelease: false
